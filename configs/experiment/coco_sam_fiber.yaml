# @package _global_
# Pretrained SAM ViT segmentation backbone + COCO object-prompt fiber analysis.
# Uses COCO boxes as object prompts, SAM masks for patch labels, fiber tests on
# pooled ViT image-encoder tokens, and local sparse dictionaries over raw patches.
defaults:
  - override /data: coco
  - override /model: tinyvit
  - override /training: debug
  - override /fiber: disabled
  - override /sam_fiber: basic
  - override /volume_probe: disabled

data:
  img_size: 224
  batch_size_test: 4
  num_workers: 0
  subset_train: null
  subset_test: 128

sam_fiber:
  model_name: facebook/sam-vit-base
  epochs: 1
  resample_each_epoch: true
  analysis_patch_size: 16
  max_tokens: 2048
  max_boxes_per_image: 16
  mask_preview_images: 12
  sparse_probe: true
  sparse_probe_algorithm: omp
  sparse_probe_residual_threshold: 0.15
  sparse_probe_max_anchors: null
  sparse_probe_heatmap_images: 8

wandb:
  enabled: true
  project: stratified-manifold-learning
  tags: [sam, segmentation, coco, fiber-analysis]
