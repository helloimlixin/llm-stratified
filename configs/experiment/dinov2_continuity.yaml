# @package _global_
# Recommended continuity experiment on a larger, higher-quality photographic dataset:
# compare overlapping pixel patches against frozen DINOv2 patch features.
defaults:
  - override /data: food101
  - override /model: tinyvit
  - override /volume_probe: dinov2_refined
  - override /fiber: disabled
  - override /training: debug

data:
  subset_test: 256
  num_workers: 0
  batch_size_test: 16

wandb:
  enabled: true
  project: stratified-manifold-learning
  tags: [dinov2, continuity, food101]
