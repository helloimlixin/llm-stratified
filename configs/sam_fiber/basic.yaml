# Frozen SAM image-encoder fiber probe with box-prompted COCO masks.
enabled: true
model_name: facebook/sam-vit-base
epochs: 1
resample_each_epoch: true
max_tokens: 1536
analysis_patch_size: 16
vol_min: 8
vol_max: 64
ws: 8
alpha: 0.005
nstrat: 3
neighborhood_size: null
progress: true
mask_threshold: 0.25
max_boxes_per_image: 16
mask_preview_images: 12
multimask_output: false
sparse_probe: true
sparse_probe_radius: null
sparse_probe_auto_neighbor_k: 32
sparse_probe_auto_radius_quantile: 0.5
sparse_probe_min_patches: 12
sparse_probe_max_anchors: null
sparse_probe_dictionary_size: 32
sparse_probe_residual_threshold: 0.15
sparse_probe_max_sparsity: 16
sparse_probe_algorithm: omp
sparse_probe_iht_steps: 80
sparse_probe_iht_lr: null
sparse_probe_heatmap_images: 8
embedding_animation: true
embedding_animation_fps: 1
