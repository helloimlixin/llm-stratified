# Full ViT token polysemy analysis (recommended preset)
enabled: true
embed_interval: 10
max_tokens: 2048
embed_full_val: true
embedding_animation: true
embedding_animation_fps: 4

vol_min: 8
vol_max: 64
ws: 8
alpha: 0.005
nstrat: 3
neighborhood_size: null

polysemy: true
polysemy_k: 48
polysemy_anchors: 12
polysemy_grid_cols: 8

polysemy_invert: true
polysemy_invert_steps: 200
polysemy_invert_restarts: 6
polysemy_invert_lr: 0.08
polysemy_invert_tv: 1e-3
polysemy_invert_l2: 1e-4
polysemy_invert_patch_only: true
polysemy_invert_blur_every: 10
polysemy_invert_blur_sigma: 0.8

# Enable ViT token polysemy with robust settings
vit_token_polysemy: true
vit_token_polysemy_k: 64
vit_token_polysemy_topk: 16
vit_token_polysemy_ablate: true
vit_token_polysemy_ablate_batches: 50
vit_token_polysemy_min_count: 100
vit_token_polysemy_ablate_reps: 10

# Sparse dictionary probe
sparse_probe: false
sparse_probe_radius: null
sparse_probe_auto_neighbor_k: 32
sparse_probe_auto_radius_quantile: 0.5
sparse_probe_min_patches: 12
sparse_probe_max_anchors: null
sparse_probe_dictionary_size: 32
sparse_probe_residual_threshold: 0.15
sparse_probe_max_sparsity: 16
