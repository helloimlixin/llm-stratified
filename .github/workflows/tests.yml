name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Smoke train (1 epoch, fake data)
        run: |
          python scripts/tinyvit.py \
            --dataset FAKEDATA \
            --epochs 1 \
            --batch-size 16 \
            --batch-size-test 16 \
            --subset-train 32 \
            --subset-test 16 \
            --num-workers 0 \
            --save-interval 1 \
            --outdir ./runs/ci_smoke \
            --no-cosine
