name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install hydra-core
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Smoke train (1 epoch, fake data)
        run: |
          python src/train.py \
            +experiment=quick_test \
            training.epochs=1 \
            data.subset_train=32 \
            data.subset_test=16 \
            data.num_workers=0 \
            hydra.run.dir=./runs/ci_smoke
